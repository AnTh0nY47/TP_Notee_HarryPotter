<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Anthony Boudet - Partiel Harry Potter</title>
  </head>
  <body class="page_perso">
    <header class="header">
      <div class="header__right">
        <a href="index.html">
          <img src="./images/logo/logo.png" alt="Logo Harry Potter" />
        </a>
      </div>
      <div class="header__left">
        <h1>Anthony Boudet - Wiki Harry Potter</h1>
        <img src="./images/menu.png" alt="Menu" onclick="toggleMenu()" />
      </div>
      <ul>
        <li>Maisons</li>
        <li>Sorts</li>
        <li>Contact</li>
        <li>Gallerie</li>
      </ul>
    </header>

    <main>
      <section>
        <h3 id="name"></h3>
        <div class="perso">
          <figure class="perso__left">
            <img id="image" src="" alt="" />
            <figcaption id="actor"></figcaption>
          </figure>

          <div class="perso__right">
            <div>
              <p>Gender</p>
              <p class="attr" id="gender"></p>
            </div>
            <div>
              <p>Eye</p>
              <p class="attr" id="eye"></p>
            </div>
            <div>
              <p>Hair</p>
              <p class="attr" id="hair"></p>
            </div>
            <div>
              <p>Date of birth</p>
              <p class="attr" id="birth"></p>
            </div>
            <div>
              <p>Patronus</p>
              <p class="attr" id="patronus"></p>
            </div>
            <div>
              <p>Nicknames</p>
              <p class="attr" id="nicknames"></p>
            </div>
          </div>
        </div>
      </section>

      <section class="house__perso">
        <img id="house-logo" src="" alt="" />
      </section>
    </main>

    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>

    <script src="./js/menu.js"></script>
    <script src="./js/details.js"></script>
  </body>
</html>
