<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Anthony Boudet - Partiel Harry Potter</title>
  </head>
  <body>
    <header class="header">
      <div class="header__right">
        <a href="index.html">
          <img src="./images/logo/logo.png" alt="Logo Harry Potter" />
        </a>
      </div>
      <div class="header__left">
        <h1>Anthony Boudet - Wiki Harry Potter</h1>
        <img src="./images/menu.png" alt="Menu" onclick="toggleMenu()" />
      </div>
      <ul>
        <li>Maisons</li>
        <li>Sorts</li>
        <li>Contact</li>
        <li>Gallerie</li>
      </ul>
    </header>

    <main>
      <section>
        <h3>Houses</h3>
        <div class="houses">
          <div onclick="filterHouse('Gryffindor')">
            <img src="./images/logo/Gryffindor.png" alt="Gryffondor" />
          </div>
          <div onclick="filterHouse('Hufflepuff')">
            <img src="./images/logo/Hufflepuff.png" alt="Poufsouffle" />
          </div>
          <div onclick="filterHouse('Ravenclaw')">
            <img src="./images/logo/Ravenclaw.png" alt="Serdaigle" />
          </div>
          <div onclick="filterHouse('Slytherin')">
            <img src="./images/logo/Slytherin.png" alt="Serpentard" />
          </div>
        </div>
      </section>

      <section class="toolbar">
        <input type="text" id="search" placeholder="Rechercher un nom..." oninput="searchByName()" />
        <button onclick="sortByName()">A à Z</button>
        <button onclick="sortByAge()">Âge</button>
        <button onclick="filterAlive(true)">Vivants</button>
        <button onclick="filterAlive(false)">Morts</button>
        <button onclick="showAll()">Tous</button>
      </section>

      <section>
        <h3>Students</h3>
        <div class="characters" id="students"></div>
      </section>

      <section>
        <h3>Staff</h3>
        <div class="characters" id="staff"></div>
      </section>
    </main>

    <footer>
      <p>Wiki Happy Potter is a FANDOM community</p>
    </footer>

    <script src="./js/menu.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
